experiment:
    project: "quadtok_512_generation"
    name: "gpt_quadtree_512_base"
    output_dir: "/mnt/localssd/gpt_quadtree_512_base"
    save_every: 10_000
    eval_every: 50_000
    generate_every: 1000
    log_every: 50
    log_grad_norm_every: 1_000
    resume: True

tokenizer:
    type: "quadtok"
    # 512 2-level EMA tokenizer (for generate-viz / decode; NOT needed for the AR training loss).
    tokenizer_ckpt_dir: "/sensei-fs-3/users/yuchengm/models/quadtok_512_280k/Tokenizer/512/checkpoint-280000/ema_model/pytorch_model.bin"
    vae_embed_dim: 8

model:
    type: "quadtok"
    grad_checkpointing: True    # master switch; grad_ckpt_interval sets the granularity
    grad_ckpt_interval: 3       # 0=off(max mem/fastest), k=ckpt every k-th of 24 blocks. k=1==full ckpt.
                                # 3 with use_liger below: MEASURED 1.184 s/step @ 105.6GB (73% of H200) on
                                # 8xH200 131k tok/GPU -- fastest interval with a safe margin. (liger frees
                                # ~22GB vs the old interval=2/no-liger 106.5GB, so k=2->3 now fits; k=4/no-ckpt
                                # are marginally faster but thinner headroom -- see GENERATOR_TRAINING.md §9.1.)
    compile: True               # QuadtreeGPT.compile_blocks(): torch.compile(block, dynamic=True). ~50s once,
                                # then stable across varying step lengths. inductor fusion -> faster AND lower
                                # peak mem (fewer materialized activations). Trainer must call it before prepare.
    use_liger: True             # fused linear-cross-entropy head (liger-kernel): never materializes the full
                                # (total_tok, 16384) fp32 logits (~8.6GB @ 131k tok) -> big peak-mem save +
                                # speedup, and lets grad_ckpt_interval go higher. Needs liger-kernel in the
                                # venv (uv pip install liger-kernel); set False to use the vanilla logits head.
    vq_model:
      quantize_mode: vq
      vit_enc_model_size: "small"
      vit_dec_model_size: "large"
      vit_enc_patch_size: 16
      vit_dec_patch_size: 16
      decoder_token_size: 256
      codebook_size: 16384
      use_l2_norm: true
      commitment_cost: 0.25
      token_size: 8
    selector:
      token_size: 8
      num_patch_side_list: [1, 2, 4, 8, 16, 32]
      patch_size_list: [16, 16, 16, 16, 16, 16]
      guaranteed_depth: 4

    generator_type: "gpt-quadtree"
    generator:
        model_size: "base"          # embed 1024 / depth 24 / heads 16 -> ~343M (FFN fixed)
        patch_size: 1
        image_size: 512
        num_patch_side_list: [1, 2, 4, 8, 16, 32]
        patch_size_list: [16, 16, 16, 16, 16, 16]
        guaranteed_depth: 4          # coarse lod4 (16x16) mandatory + lod5 (32x32)
        class_num: 1000
        condition_num_classes: 1000
        mask_ratio_min: 0.7
        buffer_size: 1
        attn_dropout: 0.0
        label_drop_prob: 0.1
        token_drop_prob: 0.1
        resid_drop_prob: 0.1
        ffn_drop_prob: 0.1
        guidance_decay: power-cosine
        guidance_scale: 6.9
        guidance_scale_pow: 1.5
        randomize_temperature: 1.0
        softmax_temperature_annealing: False

# VARLEN packing (no padding): global token budget = 262144*4 (old 256px 256tok*1024bs=262144;
# 512-guided ~1010 tok ~= 4x -> 4x to keep ~1024 samples/global-step). per-GPU = global // world.
varlen:
    global_max_tokens: 1048576   # 262144 * 4
    pretok_glob: "/sensei-fs-3/users/yuchengm/data/quadtok_512_pretok_smoke/pretok-*.tar"

optimizer:
    name: adamw
    params:
        learning_rate: 4e-4
        beta1: 0.9
        beta2: 0.95
        weight_decay: 0.05

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 50_000
        end_lr: 2e-5

training:
    gradient_accumulation_steps: 1
    mixed_precision: "bf16"
    enable_tf32: True
    enable_wandb: False
    use_ema: False
    seed: 42
    max_train_steps: 400_000
    max_grad_norm: 1.0
