experiment:
    project: "quadtok_512"
    name: "quadtok_512_2level_tokenizer_scratch"
    # LOCAL SSD (fast, ephemeral, off the 500GB sensei-fs quota). The launch script mirrors
    # this dir to S3 every few min and pulls the latest checkpoint back on (re)start.
    output_dir: "/mnt/localssd/quadtok_512_out"
    max_train_examples: 685_800_000
    save_every: 2_500
    eval_every: 50_000
    generate_every: 500
    log_every: 50
    log_grad_norm_every: 1_000
    resume: True
    use_wandb_id: true   # persist wandb run id -> auto-resume continues the SAME run
    # From scratch (no warm-start): 512 is the deeper-shifted 2-level, weights do not transfer
    # cleanly from the 256 recipe, and the user chose scratch.
    init_weight:


model:
    type: "quadtok"
    grad_checkpointing: False
    train_policy: False
    vq_model:
      quantize_mode: vq
      vit_enc_model_size: "small"
      vit_dec_model_size: "large"
      vit_enc_patch_size: 16
      vit_dec_patch_size: 16
      decoder_token_size: 256
      codebook_size: 16384
      use_l2_norm: True
      commitment_cost: 0.25
      token_size: 8
    selector:
      token_size: 8
      # 2-level @ 512: the 256 2-level (lod3 8x8 + lod4 16x16) shifted one level deeper.
      # coarse = lod4 16x16 (256, mandatory) + fine = lod5 32x32 (up to 1024). Tokens live at lod>=4.
      num_patch_side_list: [1, 2, 4, 8, 16, 32]
      # Finest patch stays 16px (512/32=16). Decoder: lod4 base canvas 256x256
      # -> ConvTranspose x2 -> lod5 canvas 512x512 (16*32) -> conv_out -> 512 image.
      patch_size_list: [16, 16, 16, 16, 16, 16]
      # Mandatory full 16x16 coarse grid; tokens = lod>=4 (two levels).
      guaranteed_depth: 4
      # single lod4->lod5 expansion prob. mean tokens = 256 + 1024*p ~= 1003 at p=0.73 (~1000).
      expansion_probs: [0.73]


losses:
    # From scratch: GAN kicks in after 200k (matches the 256/3-level from-scratch recipe).
    discriminator_start: 200_000
    quantizer_weight: 1.0
    discriminator_factor: 1.0
    discriminator_weight: 0.1
    perceptual_loss: "lpips-convnext_s-1.0-0.1"
    perceptual_weight: 1.1
    reconstruction_loss: "l2"
    reconstruction_weight: 1.0
    lecam_regularization_weight: 0.001

dataset:
    type: "simple_image"
    params:
        train_shards_path_or_url: "/sensei-fs-3/users/yuchengm/data/imagenet-wds/train/train-{000000..001469}.tar"
        eval_shards_path_or_url: "/sensei-fs-3/users/yuchengm/data/imagenet-wds/val/val-{000000..000049}.tar"
        num_workers_per_gpu: 12
    preprocessing:
        # 512 crop. ImageNet short edges are often < 512 -> upscaled (accepted; quality ceiling).
        resize_shorter_edge: 512
        crop_size: 512
        random_crop: True
        random_flip: True
        res_ratio_filtering: True

optimizer:
    name: adamw
    params:
        learning_rate: 1e-4
        discriminator_learning_rate: 1e-4
        beta1: 0.9
        beta2: 0.999
        weight_decay: 1e-4

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 10_000
        end_lr: 1e-5

training:
    # 1 node x 8 H200 x per_gpu 32 x accum 2 = global batch 512.
    # Smoke measured (512px, H200): bs16->43.8GB, bs32->82.2GB (~2.4GB/sample). bs64 OOMs (~140GB).
    # grad_accum 2 (bs32 x2) == bs64 gradients with zero recompute -> faster than grad_ckpt (~+30%);
    # grad_checkpointing is NOT wired into the tokenizer's ResidualAttentionBlock anyway.
    gradient_accumulation_steps: 2
    per_gpu_batch_size: 32
    mixed_precision: "bf16"
    enable_tf32: True
    enable_wandb: True
    use_ema: True
    seed: 42
    max_train_steps: 350_000
    num_generated_images: 2
    max_grad_norm: 1.0
