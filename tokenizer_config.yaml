experiment:
  project: dynamic_tokenizer
  name: quadtok_sl256_vq_ts8-16kcodebook-2lods
  output_dir: checkpoints/quadtok_sl256_vq_ts8-16kcodebook-2lods
  max_train_examples: 685800000
  save_every: 25000
  eval_every: 50000
  generate_every: 500
  log_every: 50
  log_grad_norm_every: 1000
  resume: true
  explanation: null
  init_weight: null
  logging_dir: checkpoints/quadtok_sl256_vq_ts8-16kcodebook-2lods/logs
model:
  type: quadtok
  grad_checkpointing: false
  train_policy: false
  vq_model:
    quantize_mode: vq
    vit_enc_model_size: small
    vit_dec_model_size: large
    vit_enc_patch_size: 16
    vit_dec_patch_size: 16
    decoder_token_size: 256
    codebook_size: 16384
    use_l2_norm: true
    commitment_cost: 0.25
    token_size: 8
  selector:
    token_size: 8
    num_patch_side_list:
    - 1
    - 2
    - 4
    - 8
    - 16
    patch_size_list:
    - 16
    - 16
    - 16
    - 16
    - 16
losses:
  discriminator_start: 200000
  quantizer_weight: 1.0
  discriminator_factor: 1.0
  discriminator_weight: 0.1
  perceptual_loss: lpips-convnext_s-1.0-0.1
  perceptual_weight: 1.1
  reconstruction_loss: l2
  reconstruction_weight: 1.0
  lecam_regularization_weight: 0.001
dataset:
  type: simple_image
  params:
    train_shards_path_or_url: pipe:rclone cat hoss:jianglihan/data/imagenet/imagenet-train-{000000..000070}.tar
    eval_shards_path_or_url: pipe:rclone cat hoss:jianglihan/data/imagenet/imagenet-val-{000000..000049}.tar
    num_workers_per_gpu: 12
  preprocessing:
    resize_shorter_edge: 256
    crop_size: 256
    random_crop: true
    random_flip: true
    res_ratio_filtering: true
optimizer:
  name: adamw
  params:
    learning_rate: 0.0001
    discriminator_learning_rate: 0.0001
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 10000
    end_lr: 1.0e-05
training:
  gradient_accumulation_steps: 1
  per_gpu_batch_size: 1
  mixed_precision: bf16
  enable_tf32: true
  enable_wandb: true
  use_ema: true
  seed: 42
  max_train_steps: 1000000
  num_generated_images: 2
  max_grad_norm: 1.0
config: configs/training/single_stage/quadtok_ss256_vq.yaml
